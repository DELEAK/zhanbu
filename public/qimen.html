<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇门遁甲 · 观微卜影</title>
<meta name="description" content="奇门遁甲起局：九宫八门九星八神、值符值使与暗干，与服务端定稿的盘面事实。">
<script>
  try {
    document.documentElement.dataset.perf = localStorage.getItem('divination.perf') === 'high' ? 'high' : 'low';
  } catch (e) {
    document.documentElement.dataset.perf = 'low';
  }
</script>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <div>
      <a class="brand" href="/">观微卜影</a>
      <span class="brand-sep">/</span>
      <span class="brand-page">奇门遁甲</span>
    </div>
    <button class="perf-toggle" type="button" role="switch" aria-checked="false" title="切换性能模式">
      <span class="perf-dot" aria-hidden="true"></span>
      性能模式 <b class="perf-state">流畅</b>
    </button>
  </div>
</header>

<main class="container">

  <section class="section" id="stepBirth">
    <h2 class="step">STEP 01 · 出生信息</h2>
    <p class="hint">起局时刻默认现在；可改为心中所念之事的时刻（本地时间）。</p>
    <div id="momentForm"></div>
    <div class="form-actions">
      <button class="btn" id="castBtn" type="button">起 盘</button>
    </div>
  </section>

  <section class="section" id="stepQuestion">
    <h2 class="step">STEP 02 · 所问之事（可选）</h2>
    <textarea class="field" id="question" rows="3" maxlength="300" placeholder="例如：明日面试是否顺利？"></textarea>
    <p class="hint">问题用于断语取用与解读侧重，不改变起局。</p>
    <div class="category-row">
      <select class="field" id="category" aria-label="解读分类">
        <option value="综合">综合</option>
        <option value="感情">感情</option>
        <option value="事业">事业</option>
        <option value="财运">财运</option>
        <option value="学业">学业</option>
        <option value="健康">健康</option>
        <option value="人际">人际</option>
      </select>
    </div>
  </section>

  <section id="result" hidden></section>

</main>

<footer>
  <div class="container">
    <p class="footer-note">本站内容仅供娱乐与自我觉察，不预测未来，也不构成医疗、心理、法律或财务决策依据。</p>
    <p class="footer-meta">服务端计算 · 无遥测</p>
  </div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/assets/app.js" defer></script>
<script src="/assets/qimen.js" defer></script>
</body>
</html>
