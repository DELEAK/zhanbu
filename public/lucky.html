<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>择吉起盘 · 观微卜影</title>
<meta name="description" content="择吉起盘：在所选时间窗内取最近一个「比平好一点」的真实盘面，盘面由引擎按规则计算，参数可复现。">
<script>
  try {
    document.documentElement.dataset.perf = localStorage.getItem('divination.perf') === 'high' ? 'high' : 'low';
  } catch (e) {
    document.documentElement.dataset.perf = 'low';
  }
</script>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <div>
      <a class="brand" href="/">观微卜影</a>
      <span class="brand-sep">/</span>
      <span class="brand-page">择吉起盘</span>
    </div>
    <button class="perf-toggle" type="button" role="switch" aria-checked="false" title="切换性能模式">
      <span class="perf-dot" aria-hidden="true"></span>
      性能模式 <b class="perf-state">流畅</b>
    </button>
  </div>
</header>

<main class="container">

  <section class="section" id="stepSetup">
    <h2 class="step">STEP 01 · 择吉条件</h2>
    <p class="hint">选一种占问术数与想占的时间。系统会在时间窗内向前/向后寻找最近一个「比平好一点」的吉盘；盘面仍由引擎按规则真实计算，所用参数会记录在案，可复现。</p>
    <div class="form-grid">
      <div class="field-cell span-2">
        <span class="field-label">术数</span>
        <select class="field" id="artId" aria-label="术数">
          <option value="xiaoliuren">小六壬（掌诀）</option>
          <option value="meihua">梅花易数（三卦体用）</option>
          <option value="qimen">奇门遁甲（九宫）</option>
          <option value="liuren">大六壬（四课三传）</option>
        </select>
      </div>
      <div class="field-cell">
        <span class="field-label">想占的时间（留空=现在）</span>
        <input class="field" id="at" type="datetime-local">
      </div>
      <div class="field-cell">
        <span class="field-label">搜索窗口</span>
        <select class="field" id="window" aria-label="搜索窗口">
          <option value="60">±1 小时</option>
          <option value="360">±6 小时</option>
          <option value="720" selected>±12 小时</option>
          <option value="1440">±24 小时</option>
          <option value="2880">±2 天</option>
          <option value="4320">±3 天</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" id="castBtn" type="button">为 我 择 吉</button>
    </div>
    <p class="hint">命盘类（八字/紫微/占星）没有吉凶档位；六爻与塔罗请走各自的普通入口。</p>
  </section>

  <section class="section" id="stepQuestion">
    <h2 class="step">STEP 02 · 所问之事</h2>
    <textarea class="field" id="question" rows="3" maxlength="300" placeholder="例如：这次合作能否顺利？"></textarea>
    <p class="hint">问题会参与吉凶判定（如奇门按问事取用神门），以及最后的提示词侧重。</p>
    <div class="category-row">
      <select class="field" id="category" aria-label="所问分类">
        <option value="综合">综合</option>
        <option value="感情">感情</option>
        <option value="事业">事业</option>
        <option value="财运">财运</option>
        <option value="学业">学业</option>
        <option value="健康">健康</option>
        <option value="人际">人际</option>
      </select>
    </div>
  </section>

  <section id="result" hidden></section>

</main>

<footer>
  <div class="container">
    <p class="footer-note">本站内容仅供娱乐与自我觉察，不预测未来，也不构成医疗、心理、法律或财务决策依据。</p>
    <p class="footer-meta">服务端计算 · 无遥测</p>
  </div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/assets/app.js" defer></script>
<script src="/assets/lucky.js" defer></script>
</body>
</html>
